---
name: crystal-tree-sitter
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/crystal-lang-tools/crystal-tree-sitter.git"
      "crystal-tree-sitter"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: crystal-tree-sitter
    shell: ${{ inputs.shell }}
  - run: crystal spec $CRYSTAL_FLAGS
    working-directory: crystal-tree-sitter
    shell: ${{ inputs.shell }}
