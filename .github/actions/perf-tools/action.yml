---
name: perf-tools
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/crystal-lang/perf-tools.git" "perf-tools"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: perf-tools
    shell: ${{ inputs.shell }}
  - run: git apply $GITHUB_ACTION_PATH/project.patch
    working-directory: perf-tools
    shell: ${{ inputs.shell }}
  - run: crystal run test.cr
    working-directory: perf-tools
    shell: ${{ inputs.shell }}
