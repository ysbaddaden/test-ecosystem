---
name: pg
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/will/crystal-pg.git" "pg"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: pg
    shell: ${{ inputs.shell }}
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost/postgres
  - run: git apply $GITHUB_ACTIONS_PATH/project.patch
    working-directory: pg
    shell: ${{ inputs.shell }}
  - run: crystal spec
    working-directory: pg
    shell: ${{ inputs.shell }}
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost/postgres
