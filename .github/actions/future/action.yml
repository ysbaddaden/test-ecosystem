---
name: future
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/crystal-community/future.cr.git" "future"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: future
    shell: ${{ inputs.shell }}
  - run: crystal spec
    working-directory: future
    shell: ${{ inputs.shell }}
