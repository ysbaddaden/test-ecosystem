---
name: granite
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/amberframework/granite.git" "granite"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: granite
    shell: ${{ inputs.shell }}
    env:
      CURRENT_ADAPTER: sqlite
      SQLITE_DATABASE_URL: sqlite3:./granite.db
      SQLITE_REPLICA_URL: sqlite3:./granite_replica.db
  - run: crystal spec $CRYSTAL_FLAGS
    working-directory: granite
    shell: ${{ inputs.shell }}
    env:
      CURRENT_ADAPTER: sqlite
      SQLITE_DATABASE_URL: sqlite3:./granite.db
      SQLITE_REPLICA_URL: sqlite3:./granite_replica.db
