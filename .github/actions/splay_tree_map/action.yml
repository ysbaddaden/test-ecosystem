---
name: splay_tree_map
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/wyhaines/splay_tree_map.cr.git" "splay_tree_map"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: splay_tree_map
    shell: ${{ inputs.shell }}
  - run: crystal spec $CRYSTAL_FLAGS
    working-directory: splay_tree_map
    shell: ${{ inputs.shell }}
