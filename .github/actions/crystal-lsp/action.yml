---
name: crystal-lsp
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/elbywan/crystal-lsp.git" "crystal-lsp"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: crystal-lsp
    shell: ${{ inputs.shell }}
  - run: crystal spec $CRYSTAL_FLAGS
    working-directory: crystal-lsp
    shell: ${{ inputs.shell }}
