---
name: timecop
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/crystal-community/timecop.cr.git" "timecop"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: timecop
    shell: ${{ inputs.shell }}
  - name: Setup tmate session
    uses: mxschmitt/action-tmate@v3
    with:
      limit-access-to-actor: true
