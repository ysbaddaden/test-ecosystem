---
name: timecop
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/crystal-community/timecop.cr.git" "timecop"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: timecop
    shell: ${{ inputs.shell }}
  - run: git apply $GITHUB_ACTIONS_PATH/project.patch
    working-directory: timecop
  - run: crystal spec
    working-directory: timecop
    shell: ${{ inputs.shell }}
