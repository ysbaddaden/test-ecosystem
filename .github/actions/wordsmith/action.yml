---
name: wordsmith
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone --depth 1 "https://github.com/luckyframework/wordsmith.git" "wordsmith"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: wordsmith
    shell: ${{ inputs.shell }}
  - run: crystal spec $CRYSTAL_FLAGS
    working-directory: wordsmith
    shell: ${{ inputs.shell }}
