---
name: pretty
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/maiha/pretty.cr.git" "pretty"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: pretty
    shell: ${{ inputs.shell }}
  - run: crystal spec
    working-directory: pretty
    shell: ${{ inputs.shell }}
