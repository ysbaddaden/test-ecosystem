---
name: totem
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/icyleaf/totem.git" "totem"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: totem
    shell: ${{ inputs.shell }}
  - run: git apply $GITHUB_ACTION_PATH/project.patch
    working-directory: totem
    shell: ${{ inputs.shell }}
  - run: crystal spec $CRYSTAL_FLAGS
    working-directory: totem
    shell: ${{ inputs.shell }}
