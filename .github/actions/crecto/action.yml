---
name: crecto
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/Crecto/crecto.git" "crecto"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: crecto
    shell: ${{ inputs.shell }}
  - run: crystal spec --tag unit
    working-directory: crecto
    shell: ${{ inputs.shell }}
