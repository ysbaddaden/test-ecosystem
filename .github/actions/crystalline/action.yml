---
name: crystalline
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/elbywan/crystalline.git" "crystalline"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: crystalline
    shell: ${{ inputs.shell }}
  - run: shards build $CRYSTAL_FLAGS
    working-directory: crystalline
    shell: ${{ inputs.shell }}
  - run: crystal spec $CRYSTAL_FLAGS
    working-directory: crystalline
    shell: ${{ inputs.shell }}
