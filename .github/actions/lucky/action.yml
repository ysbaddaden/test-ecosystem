---
name: lucky
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone --depth 1 "https://github.com/luckyframework/lucky.git" "lucky"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: lucky
    shell: ${{ inputs.shell }}
  - run: crystal spec $CRYSTAL_FLAGS
    working-directory: lucky
    shell: ${{ inputs.shell }}
