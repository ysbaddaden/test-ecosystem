---
name: mint-lang
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/mint-lang/mint.git" "mint-lang"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: mint-lang
    shell: ${{ inputs.shell }}
  - run: shards build $CRYSTAL_FLAGS
    working-directory: mint-lang
    shell: ${{ inputs.shell }}
  - run: crystal spec $CRYSTAL_FLAGS
    working-directory: mint-lang
    shell: ${{ inputs.shell }}
  - run: crystal spec spec_cli/*_spec.cr spec_cli/**/*_spec.cr $CRYSTAL_FLAGS
    working-directory: mint-lang
    shell: ${{ inputs.shell }}
