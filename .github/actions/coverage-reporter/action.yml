---
name: coverage-reporter
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/coverallsapp/coverage-reporter.git" "coverage-reporter"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: coverage-reporter
    shell: ${{ inputs.shell }}
  - run: pip install coverage
    working-directory: coverage-reporter
    shell: ${{ inputs.shell }}
  - run: pip install pytest
    working-directory: coverage-reporter
    shell: ${{ inputs.shell }}
  - run: crystal spec $CRYSTAL_FLAGS
    working-directory: coverage-reporter
    shell: ${{ inputs.shell }}
