---
name: invidious
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/iv-org/invidious.git" "invidious"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: invidious
    shell: ${{ inputs.shell }}
  - run: git submodule init
    working-directory: invidious
    shell: ${{ inputs.shell }}
  - run: git submodule update
    working-directory: invidious
    shell: ${{ inputs.shell }}
  - run: crystal build $CRYSTAL_FLAGS src/invidious.cr
    working-directory: invidious
    shell: ${{ inputs.shell }}
  - run: crystal spec $CRYSTAL_FLAGS
    working-directory: invidious
    shell: ${{ inputs.shell }}
