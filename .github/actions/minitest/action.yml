---
name: minitest
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/ysbaddaden/minitest.cr.git" "minitest"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: minitest
    shell: ${{ inputs.shell }}
  - run: make test CRFLAGS="$CRYSTAL_FLAGS"
    working-directory: minitest
    shell: ${{ inputs.shell }}
