---
name: kilt
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/jeromegn/kilt.git" "kilt"
    shell: ${{ inputs.shell }}
  - run: shards install
    working-directory: kilt
    shell: ${{ inputs.shell }}
  - run: crystal spec
    working-directory: kilt
    shell: ${{ inputs.shell }}
