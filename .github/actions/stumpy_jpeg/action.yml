---
name: stumpy_jpeg
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/stumpycr/stumpy_jpeg.git" "stumpy_jpeg"
    shell: ${{ inputs.shell }}
  - run: shards install
    working-directory: stumpy_jpeg
    shell: ${{ inputs.shell }}
  - run: crystal spec
    working-directory: stumpy_jpeg
    shell: ${{ inputs.shell }}
