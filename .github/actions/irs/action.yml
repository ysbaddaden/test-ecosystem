---
name: irs
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/cooperhammond/irs" "irs"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: irs
    shell: ${{ inputs.shell }}
  - run: shards build $CRYSTAL_FLAGS
    working-directory: irs
    shell: ${{ inputs.shell }}
