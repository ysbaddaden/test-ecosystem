---
name: ameba
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone --depth 1 "https://github.com/crystal-ameba/ameba.git" "ameba"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: ameba
    shell: ${{ inputs.shell }}
  - run: shards build $CRYSTAL_FLAGS
    working-directory: ameba
    shell: ${{ inputs.shell }}
  - run: crystal spec
    working-directory: ameba
    shell: ${{ inputs.shell }}
