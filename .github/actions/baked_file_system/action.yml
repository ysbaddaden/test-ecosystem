---
name: baked_file_system
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/schovi/baked_file_system.git" "baked_file_system"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: baked_file_system
    shell: ${{ inputs.shell }}
  - run: crystal spec
    working-directory: baked_file_system
    shell: ${{ inputs.shell }}
