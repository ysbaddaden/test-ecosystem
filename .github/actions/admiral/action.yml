---
name: admiral
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone "https://github.com/jwaldrip/admiral.cr.git" "admiral"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: admiral
    shell: ${{ inputs.shell }}
  - run: crystal spec
    working-directory: admiral
    shell: ${{ inputs.shell }}
