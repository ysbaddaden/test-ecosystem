---
name: random
inputs:
  shell:
    type: string
    default: bash
runs:
  using: composite
  steps:
  - run: git clone --depth 1 "https://github.com/ysbaddaden/random.cr" "random"
    shell: ${{ inputs.shell }}
  - run: shards install --skip-postinstall --skip-executables
    working-directory: random
    shell: ${{ inputs.shell }}
  - run: crystal spec $CRYSTAL_FLAGS
    working-directory: random
    shell: ${{ inputs.shell }}
