---
name: Formats
"on":
  push: 
  pull_request: 
  workflow_dispatch:
    inputs:
      crystal:
        type: string
        default: nightly
jobs:
  Formats:
    runs-on: ubuntu-latest
    steps:
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ github.event.inputs.crystal || 'nightly' }}
        shards: ${{ github.event.inputs.shards || 'nightly' }}
    - run: git clone "https://github.com/vladfaust/time_format.cr" "time_format"
    - name: time_format
      run: crystal tool format
      working-directory: time_format
    - run: git clone "https://github.com/ysbaddaden/minitest.cr.git" "minitest"
    - name: minitest
      run: crystal tool format
      working-directory: minitest
    - run: git clone "https://github.com/manastech/webmock.cr.git" "webmock"
    - name: webmock
      run: crystal tool format
      working-directory: webmock
    - run: git clone "https://github.com/jeromegn/slang.cr" "slang"
    - name: slang
      run: crystal tool format
      working-directory: slang
    - run: git clone "https://github.com/luislavena/radix.git" "radix"
    - name: radix
      run: crystal tool format
      working-directory: radix
    - run: git clone "https://github.com/mamantoha/http_proxy.cr" "http_proxy"
    - name: http_proxy
      run: crystal tool format
      working-directory: http_proxy
    - run: git clone "https://github.com/jeromegn/kilt.git" "kilt"
    - name: kilt
      run: crystal tool format
      working-directory: kilt
    - run: git clone "https://github.com/artic-fox/spectator.git" "spectator"
    - name: spectator
      run: crystal tool format
      working-directory: spectator
    - run: git clone "https://github.com/crystal-community/msgpack-crystal.cr" "msgpack"
    - name: msgpack
      run: crystal tool format
      working-directory: msgpack
    - run: git clone "https://github.com/ysbaddaden/sync.git" "sync"
    - name: sync
      run: crystal tool format
      working-directory: sync
    - run: git clone "https://github.com/icyleaf/markd.git" "markd"
    - name: markd
      run: crystal tool format
      working-directory: markd
    - run: git clone "https://github.com/straight-shoota/crinja.cr" "crinja"
    - name: crinja
      run: crystal tool format
      working-directory: crinja
    - run: git clone "https://github.com/crystal-community/future.git" "future"
    - name: future
      run: crystal tool format
      working-directory: future
    - run: git clone "https://github.com/icyleaf/halite.git" "halite"
    - name: halite
      run: crystal tool format
      working-directory: halite
    - run: git clone "https://github.com/crystal-loot/exception_page.git" "exception_page"
    - name: exception_page
      run: crystal tool format
      working-directory: exception_page
    - run: git clone "https://github.com/Sija/backtracer.cr.git" "backtracer"
    - name: backtracer
      run: crystal tool format
      working-directory: backtracer
    - run: git clone "https://github.com/maiha/pretty.cr" "pretty"
    - name: pretty
      run: crystal tool format
      working-directory: pretty
    - run: git clone "https://github.com/kostya/lexbor.git" "lexbor"
    - name: lexbor
      run: crystal tool format
      working-directory: lexbor
    - run: git clone "https://github.com/schovi/baked_file_system.git" "baked_file_system"
    - name: baked_file_system
      run: crystal tool format
      working-directory: baked_file_system
    - run: git clone "https://github.com/jwaldrip/admiral.cr" "admiral"
    - name: admiral
      run: crystal tool format
      working-directory: admiral
    - run: git clone "https://github.com/stumpycr/stumpy_jpeg.git" "stumpy_jpeg"
    - name: stumpy_jpeg
      run: crystal tool format
      working-directory: stumpy_jpeg
    - run: git clone "https://github.com/stumpycr/stumpy_bmp.git" "stumpy_bmp"
    - name: stumpy_bmp
      run: crystal tool format
      working-directory: stumpy_bmp
    - run: git clone "https://github.com/stumpycr/stumpy_png.git" "stumpy_png"
    - name: stumpy_png
      run: crystal tool format
      working-directory: stumpy_png
    - run: git clone "https://github.com/stumpycr/stumpy_gif.git" "stumpy_gif"
    - name: stumpy_gif
      run: crystal tool format
      working-directory: stumpy_gif
    - run: git clone "https://github.com/stumpycr/stumpy_core.git" "stumpy_core"
    - name: stumpy_core
      run: crystal tool format
      working-directory: stumpy_core
    - run: git clone "https://github.com/crystal-lang/shards.git" "shards"
    - name: shards
      run: crystal tool format src spec
      working-directory: shards
    - run: git clone "https://github.com/crystal-lang/crystal-mysql.git" "mysql"
    - name: mysql
      run: crystal tool format
      working-directory: mysql
    - run: git clone "https://github.com/will/crystal-pg.git" "pg"
    - name: pg
      run: crystal tool format
      working-directory: pg
