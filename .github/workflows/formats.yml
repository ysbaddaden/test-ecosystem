      run: crystal tool format
      working-directory: avram
    - run: git clone "https://github.com/crystal-lang/crystal-db.git" "db"
    - name: db
      run: crystal tool format
      working-directory: db
    - run: git clone "https://github.com/crystal-lang/crystal-sqlite3.git" "sqlite3"
    - name: sqlite3
      run: crystal tool format
      working-directory: sqlite3
    - run: git clone "https://github.com/luckyframework/lucky.git" "lucky"
    - name: lucky
      run: crystal tool format
      working-directory: lucky
    - run: git clone "https://github.com/luckyframework/lucky_router.git" "lucky_router"
    - name: lucky_router
      run: crystal tool format
      working-directory: lucky_router
    - run: git clone "https://github.com/luckyframework/wordsmith.git" "wordsmith"
    - name: wordsmith
      run: crystal tool format
      working-directory: wordsmith
    - run: git clone "https://github.com/luckyframework/lucky_task.git" "lucky_task"
    - name: lucky_task
      run: crystal tool format
      working-directory: lucky_task
    - run: git clone "https://github.com/luckyframework/habitat.git" "habitat"
    - name: habitat
      run: crystal tool format
      working-directory: habitat
    - run: git clone "https://github.com/kemalcr/kemal-session.git" "kemal-session"
    - name: kemal-session
      run: crystal tool format
      working-directory: kemal-session
    - run: git clone "https://github.com/kemalcr/kemal.git" "kemal"
    - name: kemal
      run: crystal tool format
      working-directory: kemal
    - run: git clone "https://github.com/iv-org/invidious.git" "invidious"
    - name: invidious
      run: crystal tool format
      working-directory: invidious
    - run: git clone "https://github.com/cloudamqp/lavinmq.git" "lavinmq"
    - name: lavinmq
      run: make format
