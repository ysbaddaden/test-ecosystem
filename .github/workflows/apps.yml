---
name: Projects
"on":
  push: 
  pull_request: 
  workflow_dispatch:
    inputs:
      crystal:
        type: string
        default: nightly
      shards:
        type: string
        default: nightly
jobs:
  Linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ github.event.inputs.crystal || 'nightly' }}
        shards: ${{ github.event.inputs.shards || 'nightly' }}
    - name: Install system dependencies
      run: sudo apt-get install --quiet --yes --no-install-recommends libsqlite3-dev
        etcd-server liblz4-dev
    - if: success() || failure()
      name: 'Project: invidious'
      uses: ./.github/actions/invidious
    - if: success() || failure()
      name: 'Project: lavinmq'
      uses: ./.github/actions/lavinmq
