---
name: Projects
"on":
  push: 
  pull_request: 
  workflow_dispatch:
    inputs:
      crystal:
        type: string
        default: nightly
      shards:
        type: string
        default: nightly
jobs:
  Linux:
    runs-on: ubuntu-latest
    steps:
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ github.event.inputs.crystal || 'nightly' }}
        shards: ${{ github.event.inputs.shards || 'nightly' }}
    - name: Install system dependencies
      run: sudo apt-get install --yes --no-install-recommends etcd-server liblz4-dev
        libsqlite3-dev
    - name: 'minitest: checkout'
      run: git clone "https://github.com/ysbaddaden/minitest.cr.git" "minitest"
    - name: 'minitest: install dependencies'
      run: shards install
      working-directory: minitest
    - name: 'minitest: make test'
      run: make test
      working-directory: minitest
    - name: 'minitest: make test CRFLAGS=''-Dpreview_mt -Dexecution_context'''
      run: make test CRFLAGS='-Dpreview_mt -Dexecution_context'
      working-directory: minitest
    - name: 'sync: checkout'
      run: git clone "https://github.com/ysbaddaden/sync.git" "sync"
    - name: 'sync: install dependencies'
      run: shards install
      working-directory: sync
    - name: 'sync: make test'
      run: make test
      working-directory: sync
    - name: 'sync: make test CRFLAGS=''-Dpreview_mt'''
      run: make test CRFLAGS='-Dpreview_mt'
      working-directory: sync
    - name: 'sync: make test CRFLAGS=''-Dpreview_mt -Dexecution_context'''
      run: make test CRFLAGS='-Dpreview_mt -Dexecution_context'
      working-directory: sync
    - name: 'lavinmq: checkout'
      run: git clone "https://github.com/cloudamqp/lavinmq.git" "lavinmq"
    - name: 'lavinmq: install dependencies'
      run: shards install
      working-directory: lavinmq
    - name: 'lavinmq: make bin/lavinmq bin/lavinmqctl bin/lavinmqperf'
      run: make bin/lavinmq bin/lavinmqctl bin/lavinmqperf
      working-directory: lavinmq
    - name: 'lavinmq: make test'
      run: make test
      working-directory: lavinmq
    - name: 'db: checkout'
      run: git clone "https://github.com/crystal-lang/crystal-db.git" "db"
    - name: 'db: install dependencies'
      run: shards install
      working-directory: db
    - name: 'db: crystal spec'
      run: crystal spec
      working-directory: db
    - name: 'sqlite3: checkout'
      run: git clone "https://github.com/crystal-lang/crystal-sqlite3.git" "sqlite3"
    - name: 'sqlite3: install dependencies'
      run: shards install
      working-directory: sqlite3
    - name: 'sqlite3: crystal spec'
      run: crystal spec
      working-directory: sqlite3
  macOS:
    runs-on: macos-latest
    steps:
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ github.event.inputs.crystal || 'nightly' }}
        shards: ${{ github.event.inputs.shards || 'nightly' }}
    - name: Install system dependencies
      run: brew install sqlite
    - name: 'minitest: checkout'
      run: git clone "https://github.com/ysbaddaden/minitest.cr.git" "minitest"
    - name: 'minitest: install dependencies'
      run: shards install
      working-directory: minitest
    - name: 'minitest: make test'
      run: make test
      working-directory: minitest
    - name: 'minitest: make test CRFLAGS=''-Dpreview_mt -Dexecution_context'''
      run: make test CRFLAGS='-Dpreview_mt -Dexecution_context'
      working-directory: minitest
    - name: 'sync: checkout'
      run: git clone "https://github.com/ysbaddaden/sync.git" "sync"
    - name: 'sync: install dependencies'
      run: shards install
      working-directory: sync
    - name: 'sync: make test'
      run: make test
      working-directory: sync
    - name: 'sync: make test CRFLAGS=''-Dpreview_mt'''
      run: make test CRFLAGS='-Dpreview_mt'
      working-directory: sync
    - name: 'sync: make test CRFLAGS=''-Dpreview_mt -Dexecution_context'''
      run: make test CRFLAGS='-Dpreview_mt -Dexecution_context'
      working-directory: sync
    - name: 'db: checkout'
      run: git clone "https://github.com/crystal-lang/crystal-db.git" "db"
    - name: 'db: install dependencies'
      run: shards install
      working-directory: db
    - name: 'db: crystal spec'
      run: crystal spec
      working-directory: db
    - name: 'sqlite3: checkout'
      run: git clone "https://github.com/crystal-lang/crystal-sqlite3.git" "sqlite3"
    - name: 'sqlite3: install dependencies'
      run: shards install
      working-directory: sqlite3
    - name: 'sqlite3: crystal spec'
      run: crystal spec
      working-directory: sqlite3
  Windows:
    runs-on: windows-latest
    steps:
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ github.event.inputs.crystal || 'nightly' }}
        shards: ${{ github.event.inputs.shards || 'nightly' }}
    - run: git config --global core.autocrlf false
    - name: 'sync: checkout'
      run: git clone "https://github.com/ysbaddaden/sync.git" "sync"
    - name: 'sync: install dependencies'
      run: shards install
      working-directory: sync
    - name: 'sync: make test'
      run: make test
      working-directory: sync
    - name: 'sync: make test CRFLAGS=''-Dpreview_mt'''
      run: make test CRFLAGS='-Dpreview_mt'
      working-directory: sync
    - name: 'sync: make test CRFLAGS=''-Dpreview_mt -Dexecution_context'''
      run: make test CRFLAGS='-Dpreview_mt -Dexecution_context'
      working-directory: sync
    - name: 'db: checkout'
      run: git clone "https://github.com/crystal-lang/crystal-db.git" "db"
    - name: 'db: install dependencies'
      run: shards install
      working-directory: db
    - name: 'db: crystal spec'
      run: crystal spec
      working-directory: db
