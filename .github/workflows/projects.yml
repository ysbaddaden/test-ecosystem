---
name: Projects
"on":
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      crystal:
        type: string
        default: nightly
      shards:
        type: string
        default: nightly
      flags:
        type: string
        default: ""
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
env:
  CRYSTAL_FLAGS: ${{ inputs.flags }}
jobs:
  db-windows:
    runs-on: windows-latest
    steps:
    - run: git config --global core.autocrlf false
    - uses: ilammy/msvc-dev-cmd@v1
    - uses: actions/checkout@v5
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ github.event.inputs.crystal || 'nightly' }}
        shards: ${{ github.event.inputs.shards || 'nightly' }}
    - run: "wget https://sqlite.org/2025/sqlite-dll-win-x64-3510000.zip"
    - run: unzip sqlite-dll-win-x64-3510000.zip
    - run: llvm-dlltool.exe -d sqlite3.def -D sqlite3.dll -l sqlite3-dynamic.lib
    - name: 'Project: sqlite3'
      uses: ./.github/actions/sqlite3
