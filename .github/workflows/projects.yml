---
name: Projects
"on":
  push: 
  pull_request: 
  workflow_dispatch:
    inputs:
      crystal:
        type: string
        default: nightly
      shards:
        type: string
        default: nightly
jobs:
  Linux:
    runs-on: ubuntu-latest
    steps:
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ github.event.inputs.crystal || 'nightly' }}
        shards: ${{ github.event.inputs.shards || 'nightly' }}
    - name: 'minitest: checkout'
      run: git clone "https://github.com/ysbaddaden/minitest.cr.git" "minitest"
    - name: 'minitest: install dependencies'
      run: shards install
      working-directory: minitest
    - name: 'minitest: make test'
      run: make test
      working-directory: minitest
    - name: 'minitest: make test CRFLAGS=''-Dpreview_mt -Dexecution_context'''
      run: make test CRFLAGS='-Dpreview_mt -Dexecution_context'
      working-directory: minitest
    - name: 'sync: checkout'
      run: git clone "https://github.com/ysbaddaden/sync.git" "sync"
    - name: 'sync: install dependencies'
      run: shards install
      working-directory: sync
    - name: 'sync: make test'
      run: make test
      working-directory: sync
    - name: 'sync: make test CRFLAGS=''-Dpreview_mt'''
      run: make test CRFLAGS='-Dpreview_mt'
      working-directory: sync
    - name: 'sync: make test CRFLAGS=''-Dpreview_mt -Dexecution_context'''
      run: make test CRFLAGS='-Dpreview_mt -Dexecution_context'
      working-directory: sync
  macOS:
    runs-on: macos-latest
    steps:
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ github.event.inputs.crystal || 'nightly' }}
        shards: ${{ github.event.inputs.shards || 'nightly' }}
    - name: 'minitest: checkout'
      run: git clone "https://github.com/ysbaddaden/minitest.cr.git" "minitest"
    - name: 'minitest: install dependencies'
      run: shards install
      working-directory: minitest
    - name: 'minitest: make test'
      run: make test
      working-directory: minitest
    - name: 'minitest: make test CRFLAGS=''-Dpreview_mt -Dexecution_context'''
      run: make test CRFLAGS='-Dpreview_mt -Dexecution_context'
      working-directory: minitest
    - name: 'sync: checkout'
      run: git clone "https://github.com/ysbaddaden/sync.git" "sync"
    - name: 'sync: install dependencies'
      run: shards install
      working-directory: sync
    - name: 'sync: make test'
      run: make test
      working-directory: sync
    - name: 'sync: make test CRFLAGS=''-Dpreview_mt'''
      run: make test CRFLAGS='-Dpreview_mt'
      working-directory: sync
    - name: 'sync: make test CRFLAGS=''-Dpreview_mt -Dexecution_context'''
      run: make test CRFLAGS='-Dpreview_mt -Dexecution_context'
      working-directory: sync
  Windows:
    runs-on: windows-latest
    steps:
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ github.event.inputs.crystal || 'nightly' }}
        shards: ${{ github.event.inputs.shards || 'nightly' }}
    - name: 'sync: checkout'
      run: git clone "https://github.com/ysbaddaden/sync.git" "sync"
    - name: 'sync: install dependencies'
      run: shards install
      working-directory: sync
    - name: 'sync: make test'
      run: make test
      working-directory: sync
    - name: 'sync: make test CRFLAGS=''-Dpreview_mt'''
      run: make test CRFLAGS='-Dpreview_mt'
      working-directory: sync
    - name: 'sync: make test CRFLAGS=''-Dpreview_mt -Dexecution_context'''
      run: make test CRFLAGS='-Dpreview_mt -Dexecution_context'
      working-directory: sync
