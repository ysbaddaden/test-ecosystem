---
name: Projects
"on":
  push: 
  pull_request: 
  workflow_dispatch:
    inputs:
      crystal:
        type: string
        default: nightly
      shards:
        type: string
        default: nightly
jobs:
  Linux:
    runs-on: ubuntu-latest
    steps:
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ github.event.inputs.crystal || 'nightly' }}
        shards: ${{ github.event.inputs.shards || 'nightly' }}
    - name: Install system dependencies
      run: sudo apt-get install --yes --no-install-recommends libsqlite3-dev
    - name: 'minitest: checkout'
      run: git clone "https://github.com/ysbaddaden/minitest.cr.git" "minitest"
    - name: 'minitest: install dependencies'
      run: shards install
      working-directory: minitest
    - name: 'minitest: make test'
      run: make test
      working-directory: minitest
    - name: 'minitest: make test CRFLAGS=''-Dpreview_mt -Dexecution_context'''
      run: make test CRFLAGS='-Dpreview_mt -Dexecution_context'
      working-directory: minitest
    - name: 'sync: checkout'
      run: git clone "https://github.com/ysbaddaden/sync.git" "sync"
    - name: 'sync: install dependencies'
      run: shards install
      working-directory: sync
    - name: 'sync: make test'
      run: make test
      working-directory: sync
    - name: 'sync: make test CRFLAGS=''-Dpreview_mt'''
      run: make test CRFLAGS='-Dpreview_mt'
      working-directory: sync
    - name: 'sync: make test CRFLAGS=''-Dpreview_mt -Dexecution_context'''
      run: make test CRFLAGS='-Dpreview_mt -Dexecution_context'
      working-directory: sync
    - name: 'sqlite3: checkout'
      run: git clone "https://github.com/crystal-lang/crystal-sqlite3.git" "sqlite3"
    - name: 'sqlite3: install dependencies'
      run: shards install
      working-directory: sqlite3
    - name: 'sqlite3: crystal spec ${CRYSTAL_FLAGS}'
      run: crystal spec ${CRYSTAL_FLAGS}
      working-directory: sqlite3
  macOS:
    runs-on: macos-latest
    steps:
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ github.event.inputs.crystal || 'nightly' }}
        shards: ${{ github.event.inputs.shards || 'nightly' }}
    - name: Install system dependencies
      run: brew install sqlite
    - name: 'minitest: checkout'
      run: git clone "https://github.com/ysbaddaden/minitest.cr.git" "minitest"
    - name: 'minitest: install dependencies'
      run: shards install
      working-directory: minitest
    - name: 'minitest: make test'
      run: make test
      working-directory: minitest
    - name: 'minitest: make test CRFLAGS=''-Dpreview_mt -Dexecution_context'''
      run: make test CRFLAGS='-Dpreview_mt -Dexecution_context'
      working-directory: minitest
    - name: 'sync: checkout'
      run: git clone "https://github.com/ysbaddaden/sync.git" "sync"
    - name: 'sync: install dependencies'
      run: shards install
      working-directory: sync
    - name: 'sync: make test'
      run: make test
      working-directory: sync
    - name: 'sync: make test CRFLAGS=''-Dpreview_mt'''
      run: make test CRFLAGS='-Dpreview_mt'
      working-directory: sync
    - name: 'sync: make test CRFLAGS=''-Dpreview_mt -Dexecution_context'''
      run: make test CRFLAGS='-Dpreview_mt -Dexecution_context'
      working-directory: sync
    - name: 'sqlite3: checkout'
      run: git clone "https://github.com/crystal-lang/crystal-sqlite3.git" "sqlite3"
    - name: 'sqlite3: install dependencies'
      run: shards install
      working-directory: sqlite3
    - name: 'sqlite3: crystal spec ${CRYSTAL_FLAGS}'
      run: crystal spec ${CRYSTAL_FLAGS}
      working-directory: sqlite3
  Windows:
    runs-on: windows-latest
    steps:
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ github.event.inputs.crystal || 'nightly' }}
        shards: ${{ github.event.inputs.shards || 'nightly' }}
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        path-type: inherit
        msystem: UCRT64
        install: 'git

          make

          mingw-w64-ucrt-x86_64-pkgconf

          mingw-w64-ucrt-x86_64-sqlite'
    - run: git config --global core.autocrlf false
      shell: msys2 {0}
    - name: 'sync: checkout'
      run: git clone "https://github.com/ysbaddaden/sync.git" "sync"
      shell: msys2 {0}
    - name: 'sync: install dependencies'
      run: shards install
      working-directory: sync
      shell: msys2 {0}
    - name: 'sync: make test'
      run: make test
      working-directory: sync
      shell: msys2 {0}
    - name: 'sync: make test CRFLAGS=''-Dpreview_mt'''
      run: make test CRFLAGS='-Dpreview_mt'
      working-directory: sync
      shell: msys2 {0}
    - name: 'sync: make test CRFLAGS=''-Dpreview_mt -Dexecution_context'''
      run: make test CRFLAGS='-Dpreview_mt -Dexecution_context'
      working-directory: sync
      shell: msys2 {0}
    - name: 'sqlite3: checkout'
      run: git clone "https://github.com/crystal-lang/crystal-sqlite3.git" "sqlite3"
      shell: msys2 {0}
    - name: 'sqlite3: install dependencies'
      run: shards install
      working-directory: sqlite3
      shell: msys2 {0}
    - name: 'sqlite3: crystal spec ${CRYSTAL_FLAGS}'
      run: crystal spec --target x86_64-windows-gnu ${CRYSTAL_FLAGS}
      working-directory: sqlite3
      shell: msys2 {0}
