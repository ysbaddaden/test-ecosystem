---
name: Projects
"on":
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      crystal:
        type: string
        default: nightly
      shards:
        type: string
        default: nightly
      flags:
        type: string
        default: ""
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
env:
  CRYSTAL_FLAGS: ${{ inputs.flags }}
jobs:
  db-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ github.event.inputs.crystal || 'nightly' }}
        shards: ${{ github.event.inputs.shards || 'nightly' }}
    - uses: ikalnytskyi/action-setup-postgres@v8
      with:
        postgres-version: "16"
    - if: success() || failure()
      name: 'Project: avram'
      uses: ./.github/actions/avram
  db-darwin:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ github.event.inputs.crystal || 'nightly' }}
        shards: ${{ github.event.inputs.shards || 'nightly' }}
    - uses: ikalnytskyi/action-setup-postgres@v8
      with:
        postgres-version: "16"
    - if: success() || failure()
      name: 'Project: avram'
      uses: ./.github/actions/avram
  db-windows:
    runs-on: windows-latest
    steps:
    - run: git config --global core.autocrlf false
    - uses: ilammy/msvc-dev-cmd@v1
    - uses: actions/checkout@v5
    - uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ github.event.inputs.crystal || 'nightly' }}
        shards: ${{ github.event.inputs.shards || 'nightly' }}
    - uses: ikalnytskyi/action-setup-postgres@v8
      with:
        postgres-version: "16"
    - if: success() || failure()
      name: 'Project: avram'
      uses: ./.github/actions/avram
