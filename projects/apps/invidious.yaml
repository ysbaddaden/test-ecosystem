name: "invidious"
source: "https://github.com/iv-org/invidious.git"
systems:
  - linux
packages:
  linux:
    - libsqlite3-dev
commands:
  - git submodule init
  - git submodule update
  - crystal build $CRYSTAL_FLAGS src/invidious.cr
  - crystal spec $CRYSTAL_FLAGS
formats:
  - crystal tool format
