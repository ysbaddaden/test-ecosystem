name: "mint-lang"
source: "https://github.com/mint-lang/mint.git"
systems:
  - linux
  - darwin
packages:
  linux:
    - libxml2-utils
  darwin:
    - libxml2
commands:
  - shards build mint $CRYSTAL_FLAGS
  - crystal spec $CRYSTAL_FLAGS
  - crystal spec spec_cli/*_spec.cr spec_cli/**/*_spec.cr $CRYSTAL_FLAGS
formats:
  - crystal tool format
