name: "timecop"
source: "https://github.com/crystal-community/timecop.cr.git"
systems:
  - linux
  - darwin
  - windows
patch: |
  diff --git a/spec/timecop_spec.cr b/spec/timecop_spec.cr
  index 41775d5..a64b888 100644
  --- a/spec/timecop_spec.cr
  +++ b/spec/timecop_spec.cr
  @@ -121,6 +121,7 @@ describe Timecop do

     context ".scale" do
       it "keeps time moving at an accelerated rate" do
  +      pending! if {{ flag?(:darwin) }}
         time = Time.local(2008, 10, 10, 10, 10, 10)
         Timecop.scale(time, 4) do
           start = Time.local
  @@ -137,6 +138,7 @@ describe Timecop do

       context "monotonic" do
         it "keeps time moving at an accelerated rate" do
  +        pending! if {{ flag?(:darwin) }}
           time = Time.local(2008, 10, 10, 10, 10, 10)
           Timecop.scale(time, 4) do
             start = Time.monotonic
  @@ -148,6 +150,7 @@ describe Timecop do

       context "instant" do
         it "keeps time moving at an accelerated rate" do
  +        pending! if {{ flag?(:darwin) }}
           time = Time.local(2008, 10, 10, 10, 10, 10)
           Timecop.scale(time, 4) do
             start = Time.instant
commands:
  - crystal spec $CRYSTAL_FLAGS
formats:
  - crystal tool format
