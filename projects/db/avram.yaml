name: "avram"
source: "https://github.com/luckyframework/avram.git"
services:
  - postgreqsl
env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost/avram"
  SAMPLE_DATABASE_URL: "postgresql://postgres:postgres@localhost/sample_backup"
commands:
  - psql -h localhost -c "CREATE DATABASE avram" "user=postgres password=postgres dbname=postgres"
  - psql -h localhost -c "CREATE DATABASE sample_backup" "user=postgres password=postgres dbname=postgres"
  - crystal spec
formats:
  - crystal tool format
