name: "avram"
source: "https://github.com/luckyframework/avram.git"
services:
  - postgreqsl
env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost/avram"
  BACKUP_DATABASE_URL: "postgresql://postgres:postgres@localhost/avram_backup"
commands:
  - psql -h localhost -c "CREATE DATABASE avram" "user=postgres password=postgres dbname=postgres"
  # - psql -h localhost -c "CREATE DATABASE avram_backup" "user=postgres password=postgres dbname=postgres"
  - rm spec/avram/tasks/db_schema_dump_spec.cr
  - crystal spec
formats:
  - crystal tool format
